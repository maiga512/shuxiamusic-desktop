[package]
name = "shuxia-tauri"
# 应用对外版本号以根目录 package.json 为唯一来源（tauri.conf.json version 指向
# ../package.json）。此处仅为 Cargo 必填项，不参与关于页/安装包版本展示，保持与
# package.json 一致即可，无需每次手动维护。
version = "1.1.7"
description = "树夏Music - Tauri Edition"
authors = ["树夏Music Team"]
edition = "2021"

[lib]
name = "shuxia_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
base64 = "0.22"
md-5 = "0.10"
sha1 = "0.10"
image = "0.25"
cpal = "0.17.3"
symphonia = { version = "0.6.0", features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSStatusItem"] }
# CGRect 用于窗口化全屏时直接读写 NSWindow 的 frame（Tauri/tao 的 set_size 走事件循环、
# set_decorations/set_always_on_top 走 GCD，顺序不可控，必须在 AppKit 层一次性完成）。
objc2-core-foundation = { version = "0.3", default-features = false, features = ["objc2"] }
block2 = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# 保持 unwind：全屏手势等 AppKit 回调里任何一处意外 panic 都只损失当前
# 动作，而不是让整个播放器进程 abort。
panic = "unwind"
